<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Bedrock Rivals</title>
<link rel="stylesheet" href="style.css">
<script src="../game-runtime.js" defer></script>
<script src="/joinstick-host.js" data-game="bedrock" defer></script>
<script defer src="game.js"></script>
</head>
<body>
<main>
  <header><a href="/">← Game launcher</a><span>CRYSTAL HEIST · PHONES REQUIRED</span></header>
  <section class="cabinet" aria-label="Bedrock Rivals game">
    <canvas width="1248" height="700" aria-label="Side-view mining battlefield"></canvas>
    <section id="overlay" class="overlay">
      <div class="menu">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title">BEDROCK<span>RIVALS</span></h1>
        <p id="brief"></p>
        <div id="roster" aria-live="polite"></div>
        <p id="prompt" aria-live="polite"></p>
        <small id="hint"></small>
      </div>
    </section>
  </section>
  <footer aria-label="How to play">
    <span><b>1 · MINE</b> Drill a route and buy a crew</span>
    <span><b>2 · STEAL</b> Defeat the guard and grab their crystal</span>
    <span><b>3 · ESCAPE</b> Carry it to your home lift</span>
  </footer>
</main>
</body>
</html>
