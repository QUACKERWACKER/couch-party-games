<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Couch Party Controller</title>
  <link rel="stylesheet" href="./pad.css">
  <script type="module" src="./pad.js"></script>
</head>
<body>
  <div class="controller-viewport">
    <main>
      <header>
        <div class="identity">
          <h1>Couch Party Controller</h1>
          <p id="status" role="status">Connecting…</p>
        </div>
        <div id="system-buttons" role="group" aria-label="Match controls"></div>
        <div class="utilities">
          <span id="player" hidden></span>
          <button type="button" id="profile-open" hidden>Players</button>
          <button type="button" id="leave" hidden>Disconnect</button>
        </div>
      </header>
      <form id="join-room" action="./" method="get" hidden>
        <input type="hidden" name="g" value="lobby">
        <label for="room-code">Room code</label>
        <div class="join-fields">
          <input id="room-code" name="r" type="text" inputmode="text" maxlength="4"
            pattern="[A-Za-z]{4}" title="Four letters" autocomplete="off" autocapitalize="characters"
            spellcheck="false" aria-describedby="status" required>
          <button type="submit">Join room</button>
        </div>
      </form>
      <div class="join-recovery" hidden>
        <button type="button" id="retry">Reconnect</button>
        <a href="./">Enter a different code</a>
      </div>
      <section id="controls" aria-label="Game controls" hidden>
        <div class="stick-group" id="movement">
          <div class="stick" data-stick="move" tabindex="0" role="group" aria-labelledby="move-label" aria-describedby="move-keys">
            <i class="knob" aria-hidden="true"></i>
          </div>
          <b id="move-label">Move</b>
          <span id="move-keys" class="sr-only">Use the arrow keys to move.</span>
        </div>
        <div id="actions">
          <div id="face-buttons" role="group" aria-label="Game actions"></div>
        </div>
        <div class="stick-group" id="aim" hidden>
          <div class="stick" data-stick="aim" tabindex="0" role="group" aria-labelledby="aim-label" aria-describedby="aim-keys">
            <i class="knob" aria-hidden="true"></i>
          </div>
          <b id="aim-label">Aim</b>
          <span id="aim-keys" class="sr-only">Use the arrow keys to aim while this stick has focus.</span>
        </div>
      </section>
      <footer class="controller-footer">
        <p id="hint" hidden></p>
        <div id="utility-buttons" role="group" aria-label="Extra controls"></div>
      </footer>
    </main>
  </div>
  <dialog id="profile-dialog" aria-labelledby="profile-title">
    <form method="dialog">
      <h2 id="profile-title">Your player</h2>
      <div class="profile-fields">
        <label>Nickname <input name="nickname" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false"></label>
        <label>Accent color <select name="color"></select></label>
      </div>
      <fieldset>
        <legend>Primary avatar</legend>
        <div id="profile-avatars"></div>
      </fieldset>
      <div class="profile-actions">
        <button value="cancel">Cancel</button>
        <button value="save">Save player</button>
      </div>
    </form>
  </dialog>
</body>
</html>
